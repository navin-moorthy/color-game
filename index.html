<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Color Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="colorGame.css" />
</head>
<body>
    <h1>The Great <br> <span id="colorDisplay">RGB</span> <br> Color Game</h1>

    <div id="rgbBreakdown">
        <h2 class="rgb-breakdown-title">Color Breakdown</h2>
        <div class="rgb-bar-container">
            <div class="rgb-label">R</div>
            <div class="rgb-bar-track">
                <div class="rgb-bar-fill red-bar" id="redBar">
                    <span class="rgb-percentage" id="redPercentage">0%</span>
                </div>
            </div>
            <div class="rgb-value" id="redValue">0</div>
        </div>
        <div class="rgb-bar-container">
            <div class="rgb-label">G</div>
            <div class="rgb-bar-track">
                <div class="rgb-bar-fill green-bar" id="greenBar">
                    <span class="rgb-percentage" id="greenPercentage">0%</span>
                </div>
            </div>
            <div class="rgb-value" id="greenValue">0</div>
        </div>
        <div class="rgb-bar-container">
            <div class="rgb-label">B</div>
            <div class="rgb-bar-track">
                <div class="rgb-bar-fill blue-bar" id="blueBar">
                    <span class="rgb-percentage" id="bluePercentage">0%</span>
                </div>
            </div>
            <div class="rgb-value" id="blueValue">0</div>
        </div>
    </div>

    <div id="stripe">
        <button id="resetColorDisplay">New Game</button>
        <span id="messageDisplay"></span>
        <button id="easyButton">Easy</button>
        <button id="hardButton" class="selected">Hard</button>
    </div>
    <div id="container">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
    </div>
    
    <script src="colorGame.js"></script>
</body>
</html>
