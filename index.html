<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>RGB Color Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="colorGame.css" />
</head>
<body>
    <header id="header">
        <h1>The Great <br> <span id="colorDisplay">RGB</span> <br> Color Game</h1>
    </header>

    <div id="rgbBreakdown">
        <div class="rgb-bar-container">
            <div class="rgb-label red-label">R</div>
            <div class="rgb-bar-track">
                <div class="rgb-bar-fill red-bar" id="redBar"></div>
            </div>
            <div class="rgb-value" id="redValue">0</div>
        </div>
        <div class="rgb-bar-container">
            <div class="rgb-label green-label">G</div>
            <div class="rgb-bar-track">
                <div class="rgb-bar-fill green-bar" id="greenBar"></div>
            </div>
            <div class="rgb-value" id="greenValue">0</div>
        </div>
        <div class="rgb-bar-container">
            <div class="rgb-label blue-label">B</div>
            <div class="rgb-bar-track">
                <div class="rgb-bar-fill blue-bar" id="blueBar"></div>
            </div>
            <div class="rgb-value" id="blueValue">0</div>
        </div>
    </div>

    <div id="stripe">
        <button id="resetColorDisplay">New Game</button>
        <span id="messageDisplay" aria-live="polite"></span>
        <div id="scoreDisplay">Score: <span id="scoreValue">0</span></div>
        <div id="difficultyButtons">
            <button id="easyButton" aria-label="Easy mode - 3 colors">Easy</button>
            <button id="hardButton" class="selected" aria-label="Hard mode - 6 colors">Hard</button>
        </div>
    </div>

    <div id="container">
        <div class="square" tabindex="0" role="button" aria-label="Color option 1"></div>
        <div class="square" tabindex="0" role="button" aria-label="Color option 2"></div>
        <div class="square" tabindex="0" role="button" aria-label="Color option 3"></div>
        <div class="square" tabindex="0" role="button" aria-label="Color option 4"></div>
        <div class="square" tabindex="0" role="button" aria-label="Color option 5"></div>
        <div class="square" tabindex="0" role="button" aria-label="Color option 6"></div>
    </div>

    <footer id="gameFooter">
        <p>Guess the color that matches the RGB value above</p>
    </footer>

    <script src="colorGame.js"></script>
</body>
</html>
